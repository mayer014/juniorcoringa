name: Sincronização diária da Câmara

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: camara-daily-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validar configuração protegida
        shell: bash
        env:
          CAMARA_API_TOKEN: ${{ secrets.CAMARA_API_TOKEN }}
          CAMARA_SYNC_SECRET: ${{ secrets.CAMARA_SYNC_SECRET }}
        run: |
          if [ -z "$CAMARA_API_TOKEN" ]; then
            echo "::error title=Segredo ausente::Cadastre CAMARA_API_TOKEN em Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          if [ -z "$CAMARA_SYNC_SECRET" ]; then
            echo "::error title=Segredo ausente::Cadastre CAMARA_SYNC_SECRET em Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Os dois segredos foram encontrados."
      - run: npm ci
      - name: Importar notícias, projetos e indicações
        run: node scripts/sync-camara-news-remote.mjs
        env:
          SITE_URL: https://juniorcoringa.com.br
          CAMARA_API_TOKEN: ${{ secrets.CAMARA_API_TOKEN }}
          CAMARA_SYNC_SECRET: ${{ secrets.CAMARA_SYNC_SECRET }}
